<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-size: 14px;
        text-transform: capitalize;
      }
      #filterBar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #clearBtn {
        max-width: 100px;
      }
      .filter {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .card {
        display: flex;
        flex-direction: column;
        max-width: 160px;
      }
      img {
        width: 100%;
        aspect-ratio: 3/5;
        object-fit: cover;
        border-radius: 8px;
        background-color: bisque;
        border: none;
      }
      input {
        max-width: 100px;
      }
      select {
        text-transform: capitalize;
      }
      select option[value=""] {
        color: rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="filterBar"></div>
    <button id="clearBtn">Clear filters</button>
    <div id="grid"></div>
    <script src="main.js" defer></script>
  </body>
</html>
